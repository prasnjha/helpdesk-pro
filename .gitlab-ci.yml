# GitLab CI pipeline for HelpDesk Pro (capstone BC-AINE-007, section 7.5).
#
# claude:review is the GitLab counterpart of the GitHub claude-review job. It is
# optional: it runs only on merge request pipelines and only when the
# ANTHROPIC_API_KEY CI/CD variable is set, and allow_failure keeps it from
# blocking a merge.

stages:
  - lint
  - typecheck
  - architecture
  - test
  - e2e
  - review

backend:lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install --no-cache-dir uv
    - uv sync --extra dev
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - backend/.venv
  script:
    - uv run ruff check .

backend:typecheck:
  stage: typecheck
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install --no-cache-dir uv
    - uv sync --extra dev
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - backend/.venv
  script:
    - uv run mypy src/

backend:architecture:
  stage: architecture
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install --no-cache-dir uv
    - uv sync --extra dev
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - backend/.venv
  script:
    - uv run lint-imports

backend:test:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install --no-cache-dir uv
    - uv sync --extra dev
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - backend/.venv
  script:
    # addopts in backend/pyproject.toml already writes coverage.xml
    - uv run pytest --cov-report=term-missing --cov-fail-under=80
  coverage: '/TOTAL.+ (\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
    expire_in: 30 days

frontend:lint:
  stage: lint
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  script:
    - npm run lint

frontend:typecheck:
  stage: typecheck
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  script:
    - npm run typecheck

frontend:test:
  stage: test
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  script:
    - npm test

frontend:e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  before_script:
    - cd frontend
    - npm ci
  script:
    # playwright.config.ts's webServer entries boot the backend (migrating
    # and seeding demo tickets) and the frontend dev server themselves
    # (E6-S3, E6-S5), so this job only needs uv + backend deps on PATH
    # before invoking the suite.
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - (cd ../backend && uv sync --extra dev)
    - npx playwright test
  artifacts:
    paths:
      - frontend/test-results
      - frontend/e2e/snapshots
    when: always
    expire_in: 14 days

claude:review:
  stage: review
  image: node:20-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ANTHROPIC_API_KEY'
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - npm install -g @anthropic-ai/claude-code
  script:
    - git diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD > merge-request.diff
    - |
      claude -p "Review this merge request diff for HelpDesk Pro. Read CLAUDE.md and backend/CLAUDE.md first. Check layer boundaries (api, service, repository, domain), role enforcement at the controller layer, SLA timers as integer minutes only, append-only tables (history, notes, assignments, SLA events), and whether each changed acceptance criterion (AC-01 to AC-10) still has a test. List findings most severe first, with file and line. If there are no issues, say so." < merge-request.diff | tee claude-review.md
  artifacts:
    when: always
    paths:
      - claude-review.md
      - merge-request.diff
    expire_in: 14 days
