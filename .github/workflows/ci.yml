name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (pytest, ruff, mypy, import-linter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy --strict)
        run: uv run mypy src/

      - name: Architecture boundaries (import-linter)
        run: uv run lint-imports

      - name: Unit and integration tests with coverage (floor 80%)
        # addopts in backend/pyproject.toml already writes coverage.xml
        run: uv run pytest --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (vitest, eslint, tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

  claude-review:
    # Optional. Runs only on pull requests, and only when the ANTHROPIC_API_KEY secret
    # exists. Without the secret every step is skipped and the job still passes.
    # Secrets are not available in a job-level `if`, so the key is checked in a step.
    name: Claude Code review (optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not set; skipping the Claude Code review."
          fi

      - name: Check out pull request
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review pull request with Claude Code
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for HelpDesk Pro. Read CLAUDE.md and backend/CLAUDE.md
            first. Check layer boundaries (api, service, repository, domain), role enforcement
            at the controller layer, SLA timers as integer minutes only, append-only tables
            (history, notes, assignments, SLA events), and whether each changed acceptance
            criterion (AC-01 to AC-10) still has a test. Post findings as review comments,
            most severe first, with file and line. If there are no issues, say so.

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11
        working-directory: backend

      - name: Install backend dependencies
        run: uv sync --extra dev
        working-directory: backend

      - name: Check for Playwright suite
        id: has_e2e
        run: |
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: steps.has_e2e.outputs.present == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.has_e2e.outputs.present == 'true'
        run: npx playwright test

      - name: No Playwright suite yet
        if: steps.has_e2e.outputs.present == 'false'
        run: echo "No playwright.config found; skipping until E6-S3 adds the suite."
